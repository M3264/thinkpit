services:
  app:
    build: .
    image: thinkpit:local
    restart: unless-stopped
    ports:
      - "${THINKPIT_BIND:-127.0.0.1}:${THINKPIT_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://thinkpit:${POSTGRES_PASSWORD:?Run scripts/setup.py first}@db:5432/thinkpit?sslmode=disable
      THINKPIT_SEARCH_URL: http://search:8080/search
      THINKPIT_PUBLIC_ORIGIN: ${THINKPIT_PUBLIC_ORIGIN:-}
      THINKPIT_USERNAME: ${THINKPIT_USERNAME:-admin}
      THINKPIT_PASSWORD: ${THINKPIT_PASSWORD:?Run scripts/setup.py first}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - thinkpit_key
    depends_on:
      db:
        condition: service_healthy
  search:
    image: searxng/searxng@sha256:a07a5cd2da2c63d66e559f9e4d3a3db106cfc6c32fb0ac70abe91cc28bcd7350
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run scripts/setup.py first}
    volumes:
      - ./deploy/search/settings.yml:/etc/searxng/settings.yml:ro
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thinkpit
      POSTGRES_DB: thinkpit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkpit -d thinkpit"]
      interval: 5s
      timeout: 5s
      retries: 10
secrets:
  thinkpit_key:
    file: ./secrets/deployment.key
volumes:
  postgres_data:
